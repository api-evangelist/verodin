name: Verodin
description: 'Verodin was a cybersecurity company that pioneered security instrumentation and validation
  — its Security Instrumentation Platform (SIP) continuously measured, tested, and improved the effectiveness
  of an organization''s security controls against real attacker behavior (a category later known as breach
  and attack simulation). Backed by Bessemer Venture Partners and TenEleven Ventures, Verodin was acquired
  by FireEye in May 2019 for approximately $250 million and rebranded as Mandiant Security Validation.
  The verodin.com domain still resolves (serving a legacy marketing placeholder) but Verodin no longer
  operates as an independent company and exposes no public developer or API surface. This profile is
  retained in the API Evangelist network as a historical portfolio-lead record.'
